name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install stock NSIS 3.11
        shell: powershell
        run: |
          choco upgrade nsis --version=3.11 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Test and build the single-file installer
        shell: powershell
        run: .\Build.ps1 -MakeNSIS "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Verify installation and Windows launch paths
        shell: powershell
        run: .\Test-Installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DriverLoom-Setup
          if-no-files-found: error
          path: |
            dist/DriverLoom-Setup.exe
            dist/DriverLoom-Setup.exe.sha256
