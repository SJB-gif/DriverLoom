name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install stock NSIS 3.11
        shell: powershell
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco upgrade nsis --version=3.11 --allow-downgrade --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'NSIS installation failed after three attempts.' }
            Write-Warning "NSIS download failed. Retrying in $($attempt * 15) seconds."
            Start-Sleep -Seconds ($attempt * 15)
          }
      - name: Test and build the single-file installer
        shell: powershell
        run: .\Build.ps1 -MakeNSIS "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Verify installation and Windows launch paths
        shell: powershell
        run: .\Test-Installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DriverLoom-Setup
          if-no-files-found: error
          path: |
            dist/DriverLoom-Setup.exe
            dist/DriverLoom-Setup.exe.sha256
