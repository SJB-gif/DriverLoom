name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install stock NSIS 3.11
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          # Upstream checksum: https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download
          $expectedHash = 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'
          $sources = @(
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip',
            'https://distfiles.macports.org/nsis/nsis-3.11.zip'
          )
          $verified = $false
          foreach ($source in $sources) {
            try {
              Invoke-WebRequest -Uri $source -OutFile $archive -UseBasicParsing -TimeoutSec 60
              if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
                throw 'Downloaded NSIS archive did not match the upstream SHA-256.'
              }
              $verified = $true
              break
            } catch {
              Write-Warning "NSIS download failed from ${source}: $($_.Exception.Message)"
            }
          }
          if (!$verified) { throw 'Could not download a verified NSIS archive from either source.' }
          $tools = Join-Path $env:RUNNER_TEMP 'driverloom-build-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force
          $compiler = Join-Path $tools 'nsis-3.11\makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'NSIS compiler is missing from the verified archive.' }
          "DRIVERLOOM_MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test and build the single-file installer
        shell: powershell
        run: .\Build.ps1 -MakeNSIS "$env:DRIVERLOOM_MAKENSIS"
      - name: Verify installation and Windows launch paths
        shell: powershell
        run: .\Test-Installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DriverLoom-Setup
          if-no-files-found: error
          path: |
            dist/DriverLoom-Setup.exe
            dist/DriverLoom-Setup.exe.sha256
